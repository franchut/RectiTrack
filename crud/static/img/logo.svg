<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- Diagonal Piston (Naranja Técnico: #ff6600) -->
    <g transform="rotate(-30 100 100)">
        <!-- Piston Rod -->
        <rect x="94" y="55" width="12" height="110" rx="3" fill="#ff6600" />
        <!-- Piston Head -->
        <rect x="70" y="25" width="60" height="35" rx="4" fill="#ff6600" />
        <!-- Piston Wrist Pin Connector -->
        <circle cx="100" cy="75" r="9" fill="#162a45" />
    </g>

    <!-- Central Gear (Azul Oscuro: #162a45) -->
    <g>
        <!-- Gear Teeth -->
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(45 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(90 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(135 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(180 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(225 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(270 100 100)" />
        <rect x="92" y="38" width="16" height="18" rx="2" fill="#162a45" transform="rotate(315 100 100)" />

        <!-- Gear Outer Ring (radius 41, width 18) -->
        <circle cx="100" cy="100" r="41" fill="none" stroke="#162a45" stroke-width="18" />
        
        <!-- Gear Spokes -->
        <rect x="96" y="50" width="8" height="100" fill="#162a45" />
        <rect x="96" y="50" width="8" height="100" fill="#162a45" transform="rotate(90 100 100)" />
        
        <!-- Gear Inner Ring (radius 16, width 12) -->
        <circle cx="100" cy="100" r="16" fill="none" stroke="#162a45" stroke-width="12" />
    </g>
</svg>
