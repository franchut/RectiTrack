{% extends "layout.html" %}
{% block body %}
<div class="row pt-5">
  <div class="col-md-4 mx-auto">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0 fw-bold">Nuevo Usuario</h4>
      </div>
      <div class="card-body p-4">
        
        <form action="{{ url_for('registrar') }}" method="POST">
          <div class="form-group mb-3">
            <label for="usuario" class="form-label fw-bold text-body">Usuario Alternativo</label>
            <input type="text" 
                   name="usuario" 
                   id="usuario" 
                   class="form-control form-control-lg" 
                   placeholder="Ej: operador_taller" 
                   required>
          </div>

          <div class="form-group mb-4">
            <label for="password" class="form-label fw-bold text-body">Contraseña Segura</label>
            <input type="password" 
                   name="password" 
                   id="password" 
                   class="form-control form-control-lg" 
                   placeholder="••••••••" 
                   required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success btn-lg fw-bold">Guardar Usuario</button>
          </div>
        </form>

      </div>
      <div class="card-footer bg-light text-center py-3 border-0">
        <span class="text-muted small">¿Ya tienes cuenta? </span>
        <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Volver al Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
