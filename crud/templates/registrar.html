{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header text-center bg-secondary text-white">
                <h4>Registrar Usuario</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('registrar') }}" method="POST">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" name="usuario" id="usuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" id="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol Asignado</label>
                        <select class="form-select" name="rol" id="rol">
                            <option value="gerente">Gerente</option>
                            <option value="operario">Operario (Técnico)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('login') }}" class="text-decoration-none">Volver al Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
