{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Modificar Ficha Técnica de Motor</h5>
            </div>
            <div class="card-body">
                <p><strong>ID Motor (Inmutable):</strong> <code class="bg-light p-1">{{ nodo[0] }}</code></p>
                <form action="{{ url_for('editar_nodo', id=nodo[0]) }}" method="POST">
                    <div class="mb-3">
                        <label for="nombre_nodo" class="form-label">Detalle del Trabajo y Especificaciones de la Marca</label>
                        <textarea class="form-control" name="nombre_nodo" id="nombre_nodo" rows="3" required>{{ nodo[1] }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('panel_iot') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
