{% extends "layout.html" %}
{% block body %}
<div class="row pt-5">
  <div class="col-md-5 mx-auto">
    <div class="card shadow border-0">
      
      <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0 fw-bold">Modificar Alias del Dispositivo</h4>
      </div>
      
      <div class="card-body p-4">
        <form action="{{ url_for('editar_nodo', id=nodo.0) }}" method="POST" onsubmit="return confirm('¿Confirmar cambio de nombre del dispositivo?');">
          
          <div class="form-group mb-3">
            <label class="form-label fw-bold text-muted">ID de Hardware</label>
            <input type="text" class="form-control form-control-lg bg-light text-secondary" value="{{ nodo.0 }}" readonly>
          </div>

          <div class="form-group mb-4">
            <label for="nombre_nodo" class="form-label fw-bold text-body">Nuevo Nombre / Alias</label>
            <input type="text" name="nombre_nodo" id="nombre_nodo" class="form-control form-control-lg" value="{{ nodo.1 }}" required autofocus>
          </div>

          <div class="row g-2">
            <div class="col-6">
              <a href="{{ url_for('panel_iot') }}" class="btn btn-outline-secondary btn-lg w-100 fw-bold">Cancelar</a>
            </div>
            <div class="col-6">
              <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Guardar</button>
            </div>
          </div>
          
        </form>
      </div>
      
    </div>
  </div>
</div>
{% endblock %}
