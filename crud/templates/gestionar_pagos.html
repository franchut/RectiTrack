{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-rectitrack text-white d-flex align-items-center">
                <a href="{{ url_for('panel_gerente') }}" class="text-white me-3"><i
                        class="bi bi-arrow-left fs-4"></i></a>
                <h5 class="mb-0 fw-bold">Gestión de Pagos</h5>
            </div>
            <div class="card-body">
                {% for pago in pagos %}
                <div class="p-3 mb-3 border rounded shadow-sm">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="fw-bold text-primary">Motor #{{ p[1] }}</span>
                        <small class="text-muted">{{ p[2] }} {{ p[3] }}</small>
                    </div>
                    <div class="row text-center mb-3">
                        <div class="col-4">
                            <small class="text-muted d-block">Total</small>
                            <span class="fw-bold">${{ p[4] }}</span>
                        </div>
                        <div class="col-4">
                            <small class="text-muted d-block">Anticipos</small>
                            <span class="text-success fw-bold">${{ p[5] }}</span>
                        </div>
                        <div class="col-4">
                            <small class="text-muted d-block">Saldo</small>
                            <span class="{{ 'text-danger' if p[6] > 0 else 'text-success' }} fw-bold">${{ p[6] }}</span>
                        </div>
                    </div>
                    {% if p[6] > 0 %}
                    <button class="btn btn-orange btn-sm w-100 fw-bold">Registrar Pago [cite: 899, 927]</button>
                    {% else %}
                    <div class="alert alert-success p-1 text-center small mb-0 fw-bold">Pagado Completo [cite: 940]
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
