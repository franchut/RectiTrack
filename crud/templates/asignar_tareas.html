{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-rectitrack text-white d-flex align-items-center">
                <a href="{{ url_for('panel_gerente') }}" class="text-white me-3"><i
                        class="bi bi-arrow-left fs-4"></i></a>
                <h5 class="mb-0 fw-bold">Asignar Tareas</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('asignar_tareas') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Área</label>
                        <select class="form-select" name="id_area" required>
                            <option value="">Seleccione un área [cite: 870]</option>
                            {% for area in areas %}
                            <option value="{{ area[0] }}">{{ area[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Motor</label>
                        <select class="form-select" name="id_orden" required>
                            <option value="">Seleccione un motor [cite: 877]</option>
                            {% for orden in ordenes %}
                            <option value="{{ orden[0] }}">Motor #{{ orden[1] }} - {{ orden[2] }} {{ orden[3] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Operario</label>
                        <select class="form-select" name="id_operario" required>
                            <option value="">Seleccione un operario [cite: 879]</option>
                            {% for operario in operarios %}
                            <option value="{{ operario[0] }}">{{ operario[1] }} {{ operario[2] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción de la Tarea</label>
                        <textarea class="form-control" name="descripcion" rows="3"
                            placeholder="Describa las instrucciones específicas para esta tarea... [cite: 881]"
                            required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('panel_gerente') }}" class="btn btn-secondary w-50">Cancelar [cite: 893]</a>
                        <button type="submit" class="btn btn-orange w-50 fw-bold">Guardar [cite: 894]</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
