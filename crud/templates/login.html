{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header text-center bg-dark text-white">
                <h4>Iniciar Sesión</h4>
                <small class="text-muted">Acceso al sistema RectiTrack</small>
            </div>
            <div class="card-body">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">USUARIO</label>
                        <input type="text" class="form-control" name="usuario" id="usuario" placeholder="Ingrese su usuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">CONTRASEÑA</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Ingrese su contraseña" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">TIPO DE USUARIO</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="rol" id="rol_gerente" value="gerente" checked>
                            <label class="btn btn-outline-secondary" for="rol_gerente">Gerente</label>

                            <input type="radio" class="btn-check" name="rol" id="rol_operario" value="operario">
                            <label class="btn btn-outline-secondary" for="rol_operario">Operador</label>

                            <input type="radio" class="btn-check" name="rol" id="rol_cliente" value="cliente">
                            <label class="btn btn-outline-secondary" for="rol_cliente">Cliente</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Ingresar</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('registrar') }}" class="text-decoration-none">¿No tienes cuenta? Registrarse</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
