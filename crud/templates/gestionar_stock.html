{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-rectitrack text-white d-flex align-items-center">
                <a href="{{ url_for('panel_gerente') }}" class="text-white me-3"><i
                        class="bi bi-arrow-left fs-4"></i></a>
                <h5 class="mb-0 fw-bold">Gestión de Stock</h5>
            </div>
            <div class="card-body p-3">
                <div class="p-3 mb-3 border rounded d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-1">Pistones Ø 84mm [cite: 871]</h6>
                        <small class="text-muted">Stock actual: 2 unidades [cite: 871]</small>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-danger-subtle text-danger d-block mb-1">Crítico [cite: 874]</span>
                        <a href="#" class="text-warning small text-decoration-none fw-bold">Reabastecer [cite: 875]</a>
                    </div>
                </div>
                <div class="p-3 mb-3 border rounded d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-1">Anillos STD [cite: 882]</h6>
                        <small class="text-muted">Stock actual: 8 unidades [cite: 883]</small>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-warning-subtle text-warning d-block mb-1">Bajo [cite: 884]</span>
                        <a href="#" class="text-warning small text-decoration-none fw-bold">Reabastecer [cite: 885]</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
