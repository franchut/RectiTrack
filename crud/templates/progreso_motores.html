{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-rectitrack text-white d-flex align-items-center">
                <a href="{{ url_for('panel_gerente') }}" class="text-white me-3"><i
                        class="bi bi-arrow-left fs-4"></i></a>
                <h5 class="mb-0 fw-bold">Progreso de Motores</h5>
            </div>
            <div class="card-body">
                {% for m in progresos %}
                <div class="p-3 mb-3 border rounded shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-bold">Motor #{{ m[0] }}</span>
                        <span class="text-orange fw-bold">{{ m[3] }}%</span>
                    </div>
                    <div class="progress mb-3" style="height: 8px;">
                        <div class="progress-bar bg-warning" role="progressbar" style="width: {{ m[3] }}%"></div>
                    </div>
                    <div class="small text-muted mb-2">
                        <div><i class="bi bi-person"></i> Operador: {{ m[1] }} {{ m[2] }} [cite: 905, 926]</div>
                        <div><i class="bi bi-info-circle"></i> Estado General: <span class="badge bg-secondary">{{ m[4]
                                }}</span></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
